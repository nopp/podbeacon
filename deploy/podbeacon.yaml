apiVersion: v1
kind: Namespace
metadata:
  name: podbeacon
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: podbeacon
  namespace: podbeacon
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: podbeacon
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: podbeacon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: podbeacon
subjects:
  - kind: ServiceAccount
    name: podbeacon
    namespace: podbeacon
---
# One replica. Alert silence lives in process memory;
# two replicas would post the same message.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podbeacon
  namespace: podbeacon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: podbeacon
  template:
    metadata:
      labels:
        app: podbeacon
    spec:
      serviceAccountName: podbeacon
      imagePullSecrets:
        - name: ghcr
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: podbeacon
          image: ghcr.io/nopp/k8s-agent-ai:1.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: podbeacon
          env:
            - name: POLL_INTERVAL
              value: 1m
            - name: ALERT_COOLDOWN
              value: 30m
            - name: STARTUP_GRACE
              value: 2m
            - name: EXCLUDE_NAMESPACES
              value: kube-system,kube-public,kube-node-lease
            - name: MAX_ALERTS_PER_SCAN
              value: "8"
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
